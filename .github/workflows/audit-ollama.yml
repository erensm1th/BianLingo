name: Audit pinned optional Ollama runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/audit_ollama_runtime.py --root runtime-audit --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-pinned-audit
          path: runtime-audit/evidence
          retention-days: 14
